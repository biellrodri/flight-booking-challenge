<!DOCTYPE html>
<html>
<head>
    <title>Destinos</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Melhores Destinos</h1>

    <table>
        <thead>
            <tr>
                <th>Origem</th>
                <th>Destino</th>
                <th>Data</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for flight in flights %}
            <tr>
                <td>{{ flight.origin }}</td>
                <td>{{ flight.destination }}</td>
                <td>{{ flight.departure_time }}</td>
                <td>
                    <a href="{% url 'create_booking' flight.id %}">Selecionar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Nenhum voo disponível</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
