<!DOCTYPE html>
<html>
<head>
    <title>Reservar Voo</title>

    <style>
        body { font-family: Arial; margin: 20px; }

        input {
            padding: 5px;
            margin: 5px;
        }

        .btn {
            padding: 8px;
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<h1>Reserva de Voo</h1>

<h3>{{ flight.origin }} → {{ flight.destination }}</h3>
<p>{{ flight.departure_time }}</p>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <h3>Passageiro</h3>

    <label>Nome:</label>
    <input type="text" name="name" required>

    <br>

    <label>Email:</label>
    <input type="email" name="email" required>

    <br>

    <label>Assento:</label>
    <input type="number" name="seat_number" required>

    <br><br>

    <button type="submit" class="btn">Confirmar Reserva</button>
</form>

</body>
</html>
